name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported Go and the current one. The broker embeds a NATS
        # server in its tests, so the matrix also catches nats-server breaking
        # on a newer toolchain.
        go: ['1.26', 'stable']
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      - name: Verify go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # staticcheck reads the compiler's export data and lags the newest Go ("export data
      # version 5 is greater than maximum supported version 4" on `stable`), so it runs on
      # the pinned toolchain only.
      - name: Staticcheck
        if: matrix.go == '1.26'
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.1 ./...

      # errcheck and gosec, configured in .golangci.yml; pinned like staticcheck, and on the pinned
      # toolchain only for the same reason.
      - name: golangci-lint
        if: matrix.go == '1.26'
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run ./...

      - name: Build
        run: go build ./...

      - name: Test
        # The slowest tests run in parallel, which brought the root package from about nine
        # minutes to about six on a macOS runner; go test's default 10 minute limit was a coin toss
        # (it fired on 2026-10-31). 20m stays as a safety net for a slow runner, not as the fix.
        run: go test -race -count=1 -timeout=20m ./...

  fuzz:
    # The decoder parses bytes from unauthenticated peers, so every push gets a
    # short fuzzing run on top of the seed corpus.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          check-latest: true

      - name: Fuzz the packet decoder
        run: go test ./packet/ -run FuzzRead -fuzz FuzzRead -fuzztime 60s

      - name: Fuzz the topic mapping
        run: go test ./topic/ -run FuzzSubjectRoundTrip -fuzz FuzzSubjectRoundTrip -fuzztime 60s

  slow:
    # Tests gated behind NATSMQTT5_SLOW_TESTS take too long for every leg of the matrix above and
    # skip there, so without this job nothing would notice a deadline coming back to the resume
    # replay. smoke.sh fails if a named test skipped instead of passing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          check-latest: true

      - name: Replay to a reader slower than thirty seconds
        env:
          NATSMQTT5_SLOW_TESTS: '1'
        run: .github/scripts/smoke.sh TestAReplayToASlowReaderIsNotCutOffAfterThirtySeconds

      - name: A killed broker's held shared message
        env:
          NATSMQTT5_SLOW_TESTS: '1'
        run: .github/scripts/smoke.sh TestAKilledBrokersHeldSharedMessageIsHeldAgainByTheRestoredSession TestAKilledBrokersHeldSharedMessageRestoredLateIsSeenTwiceNotThrice TestAKilledBrokersHeldSharedQoS2MessageIsHeldAgainByTheRestoredSession_MQTT_4_4_0_1 TestAKilledBrokersQoS2MessagePastPubrecIsNotGivenToTheGroup_MQTT_4_3_3_8

  cluster:
    # The tests that need a three-server NATS cluster (an isolated server, a restart, a long
    # outage) run the servers in containers; natscluster_test.go drives docker here and Apple's
    # `container` on a Mac. They are gated behind NATSMQTT5_CLUSTER_TESTS so the matrix above
    # skips them, and smoke.sh fails the job if one skipped instead of passing.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          check-latest: true

      - name: Run the cluster tests
        env:
          NATSMQTT5_CLUSTER_TESTS: '1'
          NATSMQTT5_CLUSTER_RUNTIME: docker
          GOFLAGS: -timeout=40m
        run: |
          names=$(go test -list '^TestCluster' . | grep '^TestCluster')
          .github/scripts/smoke.sh $names

      - name: No container left behind
        if: always()
        run: |
          left=$(docker ps -aq --filter name=natsmqtt5-ct-)
          if [ -n "$left" ]; then echo "containers left behind: $left" >&2; exit 1; fi

  docker:
    # Builds the image and runs the quickstart from the README against it, so
    # a broken Dockerfile or compose file fails the pull request rather than
    # the release.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: natsmqtt5:ci
          build-args: VERSION=ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The entrypoint runs
        run: docker run --rm natsmqtt5:ci -version

      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          check-latest: true

      # Two brokers, so the smoke tests cover the cross-broker session as well
      # as the single-broker quickstart. They are separate containers sharing
      # only a NATS server, which the in-process suite cannot reproduce.
      - name: Start NATS and both brokers
        env:
          NATSMQTT5_PERSISTENT_SESSIONS: 'true'
        run: docker compose -f compose.yaml -f compose.ci.yaml --profile cluster up -d

      - name: Wait for the brokers
        run: |
          .github/scripts/wait-for-tcp.sh 127.0.0.1 1883 60
          .github/scripts/wait-for-tcp.sh 127.0.0.1 1884 60

      # smoke.sh fails if a named test skipped rather than ran, because the
      # smoke tests skip by design when no broker address is set — without the
      # check, a misconfigured step would go green having tested nothing.
      - name: Smoke test the running images
        env:
          NATSMQTT5_SMOKE_ADDR: 127.0.0.1:1883
          NATSMQTT5_SMOKE_ADDR_B: 127.0.0.1:1884
        run: .github/scripts/smoke.sh TestSmoke TestSmokeSessionMovesBetweenBrokers

      - name: Logs
        if: always()
        run: docker compose -f compose.yaml -f compose.ci.yaml --profile cluster logs

  published-image:
    # Drives the README's headline `docker run` against the image users actually
    # get, pulled anonymously.
    #
    # The `docker` job above cannot do this and should not try: compose.ci.yaml
    # overrides `image:` with a locally built natsmqtt5:ci so the smoke tests
    # exercise the working tree, which is right — and means nothing ever checked
    # that the published image is reachable. It was not, for fourteen days, with
    # this workflow green the whole time (#7). Absence of a failing test is not
    # presence of a passing one.
    #
    # Deliberately no `docker login`: authenticating would answer a different
    # question than the one the README makes a promise about. `:latest` rather
    # than the version compose.yaml pins, because that pin names the release
    # being prepared and does not exist until the tag is pushed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Pull the published image with no credential
        run: docker pull ghcr.io/taumatix/natsmqtt5:latest

      - name: It is the image the README describes
        run: |
          set -eux
          docker run --rm ghcr.io/taumatix/natsmqtt5:latest -version
          # distroless/static has no shell, so this must fail. A passing `sh`
          # would mean the base image quietly changed under the README's claim.
          if docker run --rm --entrypoint sh ghcr.io/taumatix/natsmqtt5:latest -c 'echo reachable'; then
            echo "a shell ran in the image; it is no longer distroless/static" >&2
            exit 1
          fi
          test "$(docker inspect -f '{{.Config.User}}' ghcr.io/taumatix/natsmqtt5:latest)" = nonroot:nonroot

      - name: Start NATS and the published broker
        run: |
          set -eux
          docker network create natsmqtt5-published
          docker run -d --name nats --network natsmqtt5-published nats:2-alpine -js
          docker run -d --name broker --network natsmqtt5-published -p 1883:1883 \
            -e NATSMQTT5_NATS=nats://nats:4222 \
            ghcr.io/taumatix/natsmqtt5:latest
          .github/scripts/wait-for-tcp.sh 127.0.0.1 1883 60

      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          check-latest: true

      - name: Smoke test the published image
        env:
          NATSMQTT5_SMOKE_ADDR: 127.0.0.1:1883
        run: .github/scripts/smoke.sh TestSmoke

      - name: Logs
        if: always()
        run: docker logs broker; docker logs nats
